services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-vscode-gui
    command: sleep infinity
    # To provision API keys into the container, create env/.env with
    # KEY=VALUE lines (e.g. ANTHROPIC_API_KEY=sk-ant-...).
    # The env/ directory is in .gitignore — your secrets stay local.
    # Comment out or remove this block if you don't need it.
    env_file:
      - ../env/.env
    volumes:
      - ..:/workspaces/pi-vscode-gui:cached
      - pi-vscode-gui-node-modules:/workspaces/pi-vscode-gui/node_modules
      - pi-vscode-gui-pi:/home/node/.pi

volumes:
  pi-vscode-gui-node-modules:
    external: true
  pi-vscode-gui-pi:
    external: true
